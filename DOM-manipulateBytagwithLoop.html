<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <p>Demo1</p>
    <p>Demo2</p>
    <p>Demo3</p>
    <p>Demo4</p>
       <button onclick="check()">Check</button>
       
       
       <script>
            function check() {
                
                const p = document.getElementsByTagName("p");
                for (let i = 0; i < p.length; i++) {
                 
               p[i].style.color="red";
               
            }

        }
       </script>
</body>
</html>
