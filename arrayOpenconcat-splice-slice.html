<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <p id="demo"></p>
        <p id="demo1"></p>
        <p id="demo2"></p>
    <script>

        // concat() operator

       const boys= ["Balu" , "Arjun" , "Anu" , "Manu"]
      
       const girls= ["Ammu" , "Anna"]
       const common=boys.concat(girls);
      
        document.getElementById("demo").innerHTML=common;


          // splice() operator
          
       const boys1= ["Balu" , "Arjun" , "Anu" , "Manu"]
       boys1.splice(1,2,"Neerav","Nithin")
       
        document.getElementById("demo1").innerHTML=boys1;


//slice() operator

      
       const boys2= ["Balu" , "Arjun" , "Anu" , "Manu"]
      const newboys=boys2.slice(1)
        document.getElementById("demo2").innerHTML=newboys;

    </script>
</body>
</html>
