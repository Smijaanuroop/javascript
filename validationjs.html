<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <style>
  .num{
            width: 600px;
            height: 600px;
            background-color: rgb(239, 238, 240);
            padding: 100px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="num">

        <h1 class="">Form:</h1>
        <form method="post" onsubmit="return validate()">
                    <label for="">Enter name:</label>
                    <input type="text" id="name_id" placeholder="Enter your Name" onkeyup="clearmsg('sp1')">
                    <span id="sp1" style="color: red;" ></span>
                    
                    <br>
                    <br>
                    <label for="">Enter Mobile Number:</label>
                    <input type="text" id="mob_id" placeholder="Enter your Mobile Number" pattern="[0-9]{10}" onkeyup="clearmsg('sp2')">
                    <span id="sp2" style="color: red;" ></span>
                    <br>
                    <br>
                    

                    <label for="">Enter Address:</label>
                    <input type="text" id="add_id" placeholder="Enter your Address" onkeyup="clearmsg('sp3')">
                    <span id="sp3" style="color: red;" ></span>
                    <br>
                    <br>
                    

                    
                    <label for="">Enter Email Address:</label>
                    <input type="text" id="email_id" placeholder="Enter your Email Address" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" onkeyup="clearmsg('sp4')">
                    <span id="sp4" style="color: red;" ></span>
                    <br>
                    <br>
                    

                    <label for="">Enter password:</label>
                    <input type="password" id="pwd_id" placeholder="Enter Password" onkeyup="clearmsg('sp5')">
                    <span id="sp5" style="color: red;" ></span>
                    <br>
                    <br>
                    
                    <button onclick="Submit()">Submit</button>
                    
        </form>
          
    </div>

 <script>
    function validate() {
        let name=document.getElementById("name_id").value.trim();
        let mobile=document.getElementById("mob_id").value.trim();
        let address=document.getElementById("add_id").value.trim();
        let emailid=document.getElementById("email_id").value.trim();
        let pwd=document.getElementById("pwd_id").value.trim();
        let valid=true;

        if (name==="") {
            document.getElementById("sp1").innerHTML="Enter Name*";
            valid = false
            
        }
          if (mobile==="") {
            document.getElementById("sp2").innerHTML="Enter 10 digit Mobile Number*";
            valid = false
            
        }

          if (address==="") {
            document.getElementById("sp3").innerHTML="Enter Address*";
            valid = false
            
        }
        
          if (emailid==="") {
            document.getElementById("sp4").innerHTML="Enter Email Address*";
            valid = false
            
        }
          if (pwd==="") {
            document.getElementById("sp5").innerHTML="Enter Password*";
            valid = false
            
        }
        return valid;
    }

    function clearmsg(id) {
        document.getElementById(id).innerHTML="";
        
    }
       
 </script>

</body>
</html>
