<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>

        .num{
            width: 200px;
            height: 600px;
            background-color: rgb(239, 238, 240);
            padding: 100px;
            text-align: center;

        }
    </style>
</head>
<body>
    <div class="num">

        <h1 class="">Number Odd or Even:</h1>
        <form action="">
                    <label for="">Enter the Number:</label>
                    <input type="text" id="Num">
                    <br>
                    <br>
                    
                    <button onclick="check()">Check</button>
                    
        </form>
        <p id = "result"></p>
   
 </div>
 <script>

        function check()
        {

            let q ;
            q= Number(document.getElementById('Num').value);
           if (q%2==0) {
                    document.write('Even Number');
           }
           else{

              document.write('Odd Number');
           }
          
          

        }
 </script>

</body>
</html>
